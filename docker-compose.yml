services:
  postgres:
    image: postgres:16-alpine
    container_name: aigovernance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aigovernance
      POSTGRES_PASSWORD: aigovernance
      POSTGRES_DB: aigovernance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigovernance -d aigovernance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
